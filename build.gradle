plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

java {
    toolchain {
            languageVersion.set(JavaLanguageVersion.of(17))
    }
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
  implementation 'org.apache.commons:commons-compress:1.28.0'
  implementation 'commons-io:commons-io:2.22.0'

  // This library is support for jaxb projects but
  // has handy indenting trax writer.
  implementation 'org.glassfish.jaxb:txw2:4.0.9'
}

application {
    // Define the main class for the application.
    mainClass = 'uk.ac.leedsbeckett.bubblecarver.Main'
}

jar {
    manifest {
        attributes(
            "Main-Class": application.mainClass
        )
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

tasks.register( 'runBatch', JavaExec ) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'uk.ac.leedsbeckett.bubblecarver.BatchProcessor'
    jvmArgs( ['-Xms3g', '-Xmx3g'] )
}
